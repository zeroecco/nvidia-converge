name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate GitHub Actions workflows
        if: matrix.python-version == '3.12'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          umask 077
          tool_root="${RUNNER_TEMP}/nvidia-converge-actionlint"
          mkdir "$tool_root"
          archive="$tool_root/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          (
            cd "$tool_root"
            printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" actionlint.tar.gz \
              | sha256sum --check --strict -
            tar --extract --file actionlint.tar.gz \
              --no-same-owner --no-same-permissions actionlint
          )
          test -f "$tool_root/actionlint"
          test ! -L "$tool_root/actionlint"
          chmod 0500 "$tool_root/actionlint"
          version_output="$("$tool_root/actionlint" -version)"
          test "${version_output%%$'\n'*}" = "$ACTIONLINT_VERSION"
          "$tool_root/actionlint" -color=false -shellcheck= -pyflakes=

      - name: Compile package
        run: python -m compileall -q nvidia_converge scripts tests

      - name: Run stdlib test suite
        run: python tests/run_tests.py

      - name: Install hash-locked test tooling
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install \
            --require-hashes --no-deps \
            --requirement requirements/release.lock

      - name: Run lint
        if: matrix.python-version == '3.12'
        run: python -m ruff check .

      - name: Run type check
        if: matrix.python-version == '3.12'
        run: |
          python -m mypy \
            nvidia_converge \
            scripts/canonicalize_sdist.py \
            scripts/check_repository_controls.py \
            scripts/check_release_evidence.py \
            scripts/export_integration_attestation.py \
            scripts/bundle_release_evidence.py \
            scripts/verify_release_evidence_bundle.py

      - name: Run pytest suite
        if: matrix.python-version == '3.12'
        run: python -m pytest -q

      - name: Smoke test module CLI
        run: |
          python -m nvidia_converge --help
          python -m nvidia_converge validate --desired examples/compute-580-open.yaml
          python -m nvidia_converge plan --json | python -m json.tool >/dev/null
          python -m nvidia_converge schema integration-results | python -m json.tool >/dev/null
          python -m nvidia_converge schema validation | python -m json.tool >/dev/null

      - name: Smoke test checkout launcher
        run: ./nvidia-converge --help

      - name: Build package artifacts
        if: matrix.python-version == '3.12'
        run: python -m build --no-isolation

      - name: Smoke test built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install \
            --isolated --no-index --no-deps --force-reinstall dist/*.whl
          nvidia-converge --version
          nvidia-converge validate --desired examples/compute-580-open.yaml
          nvidia-converge schema report | python -m json.tool >/dev/null
          nvidia-converge schema integration-results | python -m json.tool >/dev/null
          nvidia-converge schema validation | python -m json.tool >/dev/null

      - name: Smoke test source distribution
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install \
            --isolated --no-index --no-deps --no-build-isolation \
            --force-reinstall dist/*.tar.gz
          nvidia-converge --version
          nvidia-converge schema validation | python -m json.tool >/dev/null
